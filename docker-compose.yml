name: uptempo
x-app: &app
  env_file: .env
  restart: unless-stopped
services:
  db:
    image: postgres:17
    profiles: ["db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptempo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-uptempo}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    build: { context: ./web, target: tools }
    image: uptempo-tools:local
    env_file: .env
    command: ["sh", "scripts/docker-migrate.sh"]
    depends_on:
      db: { condition: service_healthy, required: false }
    restart: "no"
  web:
    <<: *app
    build:
      context: ./web
      target: web
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://127.0.0.1:3000}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    image: uptempo-web:local
    ports: ["${UPTEMPO_PORT:-3000}:3000"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    <<: *app
    build: { context: ./web, target: tools }
    image: uptempo-tools:local
    command: ["pnpm", "run", "worker"]
    environment:
      UPTEMPO_WORKER_TARGET_URL: "http://web:3000"
    depends_on:
      web: { condition: service_healthy }
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID:-uptempo}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY:-change-me-please}"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    env_file: .env
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" && mc mb --ignore-existing local/$$S3_BUCKET && mc anonymous set download local/$$S3_BUCKET",
      ]
volumes:
  db-data: {}
  uploads: {}
  minio-data: {}
