name: Docker

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          target: tools
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
