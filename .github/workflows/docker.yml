name: Docker

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: [self-hosted, riley-public-ci-linux-arm64]
    steps:
      - uses: actions/checkout@v4

      # QEMU keeps the linux/amd64 build coverage this check had on amd64 runners.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          target: web
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tools:
    runs-on: [self-hosted, riley-public-ci-linux-arm64]
    steps:
      - uses: actions/checkout@v4

      # QEMU keeps the linux/amd64 build coverage this check had on amd64 runners.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          target: tools
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
