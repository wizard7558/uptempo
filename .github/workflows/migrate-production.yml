# Production database migrations run only through an explicit manual dispatch
# against reviewed main. Apply and verify the migration outcome before an
# operator forces, stages, or promotes a migration-changing commit to production.
# A separately approved manual rollout with a verified receipt is also valid.

name: Migrate production database

on:
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.repository == 'wizard7558/uptempo' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply platform + tenant migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing GitHub secret PRODUCTION_DATABASE_URL (use the same Neon URL as Vercel Production DATABASE_URL)."
            exit 1
          fi
          pnpm run migrate
